<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品牌工作台</title>
<style>
:root{
  --bg:#f5f6f1; --card:#fff; --ink:#15180f; --mute:#7c8271; --line:#e6e8de;
  --side:#0e1210; --side-ink:#c9cfc2; --lime:#c8ff00; --lime-ink:#10140a; --olive:#7f9a2c; --soft:#eef3dc;
  --danger:#c0392b; --warn:#b7791f; --ok:#3d7a1f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--side)}
.login form{background:#fff;border-radius:20px;padding:36px;width:min(380px,92vw)}
.logo{font-weight:800;font-size:28px;letter-spacing:-1px}.logo small{font-weight:600;font-size:16px}
.sub{font-size:11px;letter-spacing:.3em;color:var(--mute);margin:2px 0 22px}
/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .logo{color:#fff;padding:0 8px}
.side .sub{padding:0 8px;color:#7d867a}
.ws{border:1px solid #29302b;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;margin:6px 0 22px}
.ws i{width:36px;height:36px;border-radius:10px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.ws b{display:block;color:#fff;font-size:14px}.ws span{font-size:12px;color:#7d867a}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--side-ink);text-decoration:none;margin-bottom:4px;cursor:pointer}
.nav a:hover{background:#171d19}.nav a.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:12px;color:#7d867a;padding:0 8px}
.side .foot button{background:none;border:0;color:#9aa296;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline}
main{padding:34px 40px 60px;max-width:1280px;width:100%}
h1{font-size:34px;margin:0 0 4px;letter-spacing:-.5px}
.lead{color:var(--mute);margin:0 0 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
/* ui */
.btn{background:var(--lime);color:var(--lime-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;border:1px solid var(--line);font-weight:600}
.btn.danger{background:#fff;border:1px solid #efc9c4;color:var(--danger);font-weight:600}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.stat.first{background:var(--soft)}
.stat p{margin:0;color:var(--mute);font-size:14px}.stat h2{font-size:40px;margin:10px 0 2px;letter-spacing:-1px}
.stat small{color:var(--mute)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1.9fr 1fr;gap:20px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs a{padding:8px 0;color:var(--mute);cursor:pointer}.tabs a.on{color:var(--ink);border-bottom:2px solid var(--olive);font-weight:600}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--olive);font-weight:800}
.item b{display:block}.item small{color:var(--mute)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#fafbf6}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600}
.chip.draft{background:#eee;color:#666}.chip.scheduled{background:#fff1cf;color:var(--warn)}.chip.sent{background:#dff3d2;color:var(--ok)}.chip.failed{background:#fbdcd8;color:var(--danger)}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:14px}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px #e4efbf}
textarea{min-height:140px;resize:vertical}
.hint{color:var(--mute);font-size:13px;margin-top:6px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,14,8,.55);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:22px;width:min(1080px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 380px}
.modal .l{padding:28px 32px}.modal .r{background:var(--soft);padding:28px;border-radius:0 22px 22px 0}
.modal h3{margin:0 0 4px;font-size:26px}
.tg{background:#fff;border-radius:20px;overflow:hidden;margin-top:10px}
.tg .hd{padding:14px;display:flex;gap:10px;align-items:center}
.tg .hd i{width:38px;height:38px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--lime-ink)}
.tg .bd{background:#dfe6d6;padding:16px;min-height:300px}
.bub{background:#fff;border-radius:14px;padding:12px 14px;max-width:100%;white-space:pre-wrap;word-break:break-word;overflow:hidden}
.bub img,.bub .vid{display:block;width:calc(100% + 28px);margin:-12px -14px 10px;max-height:200px;object-fit:cover;background:#222}
.bub .vid{height:150px;display:grid;place-items:center;color:#fff}
.bub .tm{text-align:right;font-size:11px;color:#9aa;margin-top:6px}
.kb{display:grid;gap:6px;margin-top:8px}.kb div{display:flex;gap:6px}
.kb span{flex:1;background:rgba(255,255,255,.75);border-radius:8px;text-align:center;padding:7px 4px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb span.off{opacity:.35;text-decoration:line-through}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.mi{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mi .th{height:140px;background:#222;display:grid;place-items:center;color:#fff;font-weight:700}
.mi .th img{width:100%;height:100%;object-fit:cover}
.mi div.in{padding:10px 12px;font-size:13px}.mi .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.row{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:14px}
.rowctl{display:flex;flex-direction:column;gap:4px}
.rowctl button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;padding:2px 0}
.bcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px}
.bcard .g{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#15180f;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.empty{padding:50px 0;text-align:center;color:var(--mute)}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;gap:8px;align-items:center}
  .ws,.side .sub,.side .foot{display:none}.nav{display:flex;flex-wrap:wrap}main{padding:22px 16px}
  .grid4{grid-template-columns:1fr 1fr}.two,.modal{grid-template-columns:1fr}.modal .r{border-radius:0 0 22px 22px}.bcard .g{grid-template-columns:1fr}
}
</style>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/mjh-ui.css">
</head>
<body>
<a href="#main" class="skip-link" id="skipMain">跳到主要内容</a>
<div class="initial-loading" id="initialLoading" role="status"><b>品牌工作台</b><div class="load-mark"></div><p>加载中…</p></div>
<div id="login" class="login hide">
<section class="simple-login-card">
<div class="simple-login-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12v3m8-3v3M9 18h6"/></svg></div>
<h1>Telegram Bot 后台登入</h1>
<form id="lf">
<label for="un">账号</label><input type="text" id="un" autocomplete="username" autocapitalize="off" placeholder="输入账号" autofocus>
<label for="pw">密码</label><div class="password-wrap"><input type="password" id="pw" required autocomplete="current-password" placeholder="输入密码"><button type="button" id="showPassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div id="lerr" role="alert"></div><button class="btn" type="submit">登入</button>
</form><p class="simple-login-help">忘记密码？请联系管理员。</p>
</section></div>

<div id="app" class="app hide">
  <aside class="side">
    
    <div class="ws"><span class="client-logo-slot" data-brand-logo><i id="wsL">B</i></span><div><b id="wsN">-</b><span>品牌工作空间</span></div></div>
    <nav class="nav" id="nav" aria-label="主要导航"></nav>
    <div class="foot"><span id="botst"></span><br><button id="logout">退出登录</button><div class="provider-credit"><span>技术支持</span><b>MJH &amp; Co.</b></div></div>
  </aside>
  <section class="workspace"><header class="workspace-bar"><div><button class="mobile-open" id="mobileOpen" aria-label="打开导航" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="breadcrumb-root">品牌工作空间</span><svg class="crumb-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><b id="breadcrumb">工作总览</b></div><div><span id="workspaceDate" class="workspace-date"></span><span class="timezone">MYT · UTC+8</span></div></header><main id="main" tabindex="-1"></main></section><div class="workspace-shade"></div>
</div>
<div id="modalRoot"></div>

<script src="/app.js"></script>
<script src="/mjh-ui.js"></script>
</body>
</html>
